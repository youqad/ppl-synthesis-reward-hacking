defaults:
  - trl_stan_linear_train
  - _self_

common:
  output_root: artifacts/train
  run_name: stan_linear_stage1_induce_family

train:
  n_steps: 4
  n_prompts: 3
  rollouts_per_prompt: 3
  num_generations: 8
  lr: 5e-6
  kl_beta: 0.001
  max_completion_length: 384
  prompt_policy: induce_subtle_family
  dataset_n_obs: 16
  dataset_noise_sigma: 1.0
  dataset_beta_scale: 1.0
  checker_mode: "off"
  report_to: none
  output_dir: artifacts/train/stan_linear_stage1_induce_family

wandb:
  enabled: false
  group: stan-linear-stage1
  tags:
    - trl
    - stan
    - linear
    - warmstart
    - stage1

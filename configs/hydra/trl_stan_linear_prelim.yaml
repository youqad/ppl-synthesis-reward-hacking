defaults:
  - trl_stan_linear_train
  - _self_

common:
  output_root: artifacts/train
  run_name: stan_linear_prelim_predictive_v2

train:
  model: Qwen/Qwen2.5-Coder-7B-Instruct
  n_steps: 2
  n_prompts: 2
  rollouts_per_prompt: 2
  num_generations: 4
  lr: 2e-6
  kl_beta: 0.003
  max_completion_length: 384
  prompt_policy: induce_subtle_family
  dataset_n_train: 16
  dataset_n_test: 4
  dataset_n_features: 1
  dataset_noise_sigma: 1.0
  beta_prior_scale: 1.0
  audit_panel_size: 4
  normalization_mc_samples: 12
  normalization_sample_size: 2
  checker_mode: "off"
  report_to: wandb
  output_dir: artifacts/train/stan_linear_prelim_predictive_v2

wandb:
  enabled: true
  group: stan-linear-prelim
  job_type: trl-stan-linear
  tags:
    - trl
    - stan
    - linear
    - predictive
    - prelim
    - wandb

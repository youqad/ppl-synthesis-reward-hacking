defaults:
  - claim_mode: formal_lh
  - paper_track: part_a_emergence
  - _self_

name: trl_stan_linear
model: Qwen/Qwen2.5-Coder-7B-Instruct
n_steps: 3
n_prompts: 4
rollouts_per_prompt: 3
lora_rank: 32
lora_dropout: 0.0
lr: 2e-6
max_completion_length: 384
use_4bit: false
resume_from: null
num_generations: 8
temperature: 1.3
top_p: 0.95
top_k: 50
kl_beta: 0.005
max_grad_norm: 1.0
save_steps: 1
report_to: none
run_name: null
thinking_mode: no_think
prompt_policy: induce_subtle_family
dataset_n_obs: 16
dataset_noise_sigma: 1.0
dataset_beta_scale: 1.0
scoring_seed_base: 0
cmdstan_root: cmdsafestan
stanc3: safestan
protect: y
compile_jobs: 4
checker_jobs: 2
checker_mode: "off"
checker_penalty_reward: -100.0
contract_penalty_reward: -100.0
score_workers: 0
output_dir: ${common.output_root}/${common.run_name}

name: Build RunPod Stan Linear Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: false
        default: "stan-linear"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push GHCR Image
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Normalize image name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          echo "IMAGE_NAME=${image,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.event.inputs.tag || 'stan-linear' }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runpod-stan-linear.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:stan-linear-${{ github.sha }}
          build-args: |
            JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image
        run: |
          echo "Published:"
          echo "  ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "  ${IMAGE_NAME}:stan-linear-${GITHUB_SHA}"
